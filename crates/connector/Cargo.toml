[package]
name = "ccc"
version.workspace = true
edition.workspace = true

[[bin]]
name = "ccc"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:sys-locale", "dep:ab_glyph"]

[dependencies]
ccc-proto = { path = "../proto" }
anyhow.workspace = true
serde.workspace = true
tokio.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true
rustls.workspace = true
clap.workspace = true
toml.workspace = true
dirs.workspace = true
rand.workspace = true
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
rpassword = "7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
sha2.workspace = true
hex.workspace = true
serde_json.workspace = true
eframe = { version = "0.33", optional = true }
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
sys-locale = { version = "0.3", optional = true }
ab_glyph = { version = "0.2", optional = true }

[dev-dependencies]
egui_kittest = { version = "0.33", features = ["wgpu", "snapshot"] }

[build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_System_Registry", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }
rfd = { version = "0.15", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
